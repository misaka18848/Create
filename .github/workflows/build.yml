name: Build Create Mod (Manual)

on:
  workflow_dispatch:  # 手动触发
    inputs:
      branch:
        description: 'Branch to build (default: mc1.20.1/dev)'
        required: false
        default: 'mc1.20.1/dev'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'mc1.20.1/dev' }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build mod with Gradle
        run: ./gradlew jar

      - name: Upload JAR from build/libs/
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: create-mod-build-libs
          path: build/libs/*.jar
